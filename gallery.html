<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갤러리</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <main>
        <h1 class="gallery-title">풍경 갤러리</h1>
        <div class="wrap">
            <figure class="gallery-card">
                <div class="gallery-art gallery-art--garden" role="img" aria-label="초록빛 정원"></div>
                <figcaption>초록빛 정원</figcaption>
            </figure>
            <figure class="gallery-card">
                <div class="gallery-art gallery-art--ocean" role="img" aria-label="푸른 바다"></div>
                <figcaption>푸른 바다</figcaption>
            </figure>
            <figure class="gallery-card">
                <div class="gallery-art gallery-art--sunset" role="img" aria-label="노을 진 하늘"></div>
                <figcaption>노을 진 하늘</figcaption>
            </figure>
            <figure class="gallery-card">
                <div class="gallery-art gallery-art--mountain" role="img" aria-label="산 너머 아침"></div>
                <figcaption>산 너머 아침</figcaption>
            </figure>
            <figure class="gallery-card">
                <div class="gallery-art gallery-art--flower" role="img" aria-label="봄날의 꽃"></div>
                <figcaption>봄날의 꽃</figcaption>
            </figure>
            <figure class="gallery-card">
                <div class="gallery-art gallery-art--forest" role="img" aria-label="깊은 숲"></div>
                <figcaption>깊은 숲</figcaption>
            </figure>
            <figure class="gallery-card">
                <div class="gallery-art gallery-art--desert" role="img" aria-label="따뜻한 사막"></div>
                <figcaption>따뜻한 사막</figcaption>
            </figure>
            <figure class="gallery-card">
                <div class="gallery-art gallery-art--lake" role="img" aria-label="고요한 호수"></div>
                <figcaption>고요한 호수</figcaption>
            </figure>
            <figure class="gallery-card">
                <div class="gallery-art gallery-art--night" role="img" aria-label="별이 빛나는 밤"></div>
                <figcaption>별이 빛나는 밤</figcaption>
            </figure>
            <figure class="gallery-card">
                <div class="gallery-art gallery-art--field" role="img" aria-label="넓은 들판"></div>
                <figcaption>넓은 들판</figcaption>
            </figure>
            <figure class="gallery-card">
                <div class="gallery-art gallery-art--island" role="img" aria-label="햇살 가득한 섬"></div>
                <figcaption>햇살 가득한 섬</figcaption>
            </figure>
            <figure class="gallery-card">
                <div class="gallery-art gallery-art--clouds" role="img" aria-label="구름 사이 햇살"></div>
                <figcaption>구름 사이 햇살</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
