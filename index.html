<!doctype html>
<html lang="ko">
  <head>    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자페이지</title>
    <link rel="stylesheet" href="styles.css" />    
  </head>
  <body>    
    <main class="login-page" data-node-id="615:257">
      <section class="login-container" aria-labelledby="login-title" data-node-id="615:273">
        <h1 id="login-title" class="login-title" data-node-id="615:258">관리자 로그인</h1>

        <form id="login-form" class="login-form" novalidate>
          <div class="input-field" data-node-id="615:271">
            <label for="admin-id" class="sr-only">아이디</label>
            <span class="input-icon input-icon--user" aria-hidden="true" data-node-id="615:263">
              <img src="88481.png" alt="" width="30" height="30" />
            </span>
            <input
              id="admin-id"
              name="username"
              type="text"
              class="input-control"
              placeholder="아이디"
              autocomplete="username"
              required
              data-node-id="615:265"
            />
          </div>

          <div class="input-field" data-node-id="615:272">
            <label for="admin-password" class="sr-only">비밀번호</label>
            <span class="input-icon input-icon--password" aria-hidden="true" data-node-id="615:264">
              <img src="26f56.png" alt="" width="30" height="30" />
            </span>
            <input
              id="admin-password"
              name="password"
              type="password"
              class="input-control"
              placeholder="비밀번호"
              autocomplete="current-password"
              required
              data-node-id="615:267"
            />
          </div>

          <button type="submit" id="login-submit" class="login-button" data-node-id="615:270">
            <span class="login-button__text" data-node-id="615:269">로그인</span>
          </button>
        </form>

        <p id="login-feedback" class="login-feedback" role="status" aria-live="polite" hidden></p>
      </section>
    </main>
    <script src="main.js"></script>    
  </body>
</html>
